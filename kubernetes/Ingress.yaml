apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb                      # Specify ALB Ingress class
    alb.ingress.kubernetes.io/scheme: internet-facing     # Internet-facing ALB
    alb.ingress.kubernetes.io/target-type: ip             # Target Pods directly
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]' # Listener for HTTP traffic
    alb.ingress.kubernetes.io/backend-protocol: HTTP      # Backend protocol
    alb.ingress.kubernetes.io/healthcheck-path: /healthz  # Health check path
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "20"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service                     # Frontend service name
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service                     # Backend service name
                port:
                  number: 8080
